name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tools
        run: python -m pip install -e ".[dev]"

      - name: Check that the tag matches the package version
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = f"v{version('meteora-rag')}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must match {expected!r}.")
          PY

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Check code style
        run: |
          python -m ruff check src/meteora_rag tests examples scripts
          python -m ruff format --check src/meteora_rag tests examples scripts

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata and README
        run: python -m twine check --strict dist/*

      - name: Test the installed wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/meteora-smoke"
          "${RUNNER_TEMP}/meteora-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/meteora-smoke/bin/python" -I scripts/smoke_test_package.py

      - uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/meteora-rag/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
