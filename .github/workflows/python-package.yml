name: Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine ruff
          python -m ruff check src/meteora_rag tests examples scripts
          python -m ruff format --check src/meteora_rag tests examples scripts
          python -m build

      - name: Validate distribution metadata and README
        run: python -m twine check --strict dist/*

      - name: Test the installed wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/meteora-smoke"
          "${RUNNER_TEMP}/meteora-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/meteora-smoke/bin/python" -I scripts/smoke_test_package.py

      - uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
