[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteora-rag"
version = "0.1.0"
description = "Rank-free, rationale-driven evidence selection for retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.9"
license = "CC-BY-4.0"
license-files = ["LICENSE", "ATTRIBUTION.md"]
authors = [
  {name = "Yash Saxena"},
  {name = "Ankur Padia"},
  {name = "Mandar S. Chaudhary"},
  {name = "Kalpa Gunaratna"},
  {name = "Srinivasan Parthasarathy"},
  {name = "Manas Gaur"},
]
keywords = ["rag", "retrieval", "evidence-selection", "llm", "ranking-free"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
sentence-transformers = [
  "sentence-transformers>=2.7",
]
hf = [
  "accelerate>=0.30",
  "torch>=2.2",
  "transformers>=4.40",
]
training = [
  "accelerate>=0.30",
  "datasets>=2.19",
  "peft>=0.10",
  "torch>=2.2",
  "transformers>=4.40",
  "trl>=0.9",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.5",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/YashSaxena21/METEORA"
Documentation = "https://github.com/YashSaxena21/METEORA#readme"
Repository = "https://github.com/YashSaxena21/METEORA"
Issues = "https://github.com/YashSaxena21/METEORA/issues"
Paper = "https://arxiv.org/abs/2505.16014"

[project.scripts]
meteora-rag = "meteora_rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["meteora_rag", "meteora_rag.*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
